huy động nguồn lực hỗ trợ","4. Xử lý tình huống đạo đức và bảo mật thông tin","5. Thiết kế và điều phối chương trình, dự án xã hội","6. Theo dõi, đánh giá dịch vụ hoặc chương trình bằng dữ liệu","7. Nghiên cứu ứng dụng để giải quyết vấn đề thực tiễn","8. Phân tích và đề xuất chính sách xã hội","9. Giám sát chuyên môn và hỗ trợ phát triển đội ngũ","10. Sử dụng công cụ số để quản lý hồ sơ và dữ liệu dịch vụ","Chưa xác định"],"max":3,"exclusive":10,"key":"13.0","column":"13. Trong danh sách năng lực ở câu 12, đâu là 3 năng lực đơn vị ưu tiên nhất khi tuyển hoặc bố trí công việc?"}]},"14":{"title":"Xin nêu một nhiệm vụ thực tế mà đơn vị kỳ vọng người tốt nghiệp thạc sĩ CTXH có thể đảm nhiệm.","fields":[{"kind":"long","optional":true,"key":"14.0","column":"14. Xin nêu một nhiệm vụ thực tế mà đơn vị kỳ vọng người tốt nghiệp thạc sĩ CTXH có thể đảm nhiệm."}]},"15":{"title":"Đơn vị có yêu cầu bổ sung nào về kinh nghiệm, ngoại ngữ hoặc năng lực chuyên môn khác?","fields":[{"kind":"long","optional":true,"key":"15.0","column":"15. Đơn vị có yêu cầu bổ sung nào về kinh nghiệm, ngoại ngữ hoặc năng lực chuyên môn khác?"}]}};
const PAGES=[["Thông tin đơn vị",[1,2,3,4,5,6]],["Hiện trạng nhân sự và tuyển dụng",[7,8]],["Nhu cầu tuyển dụng và đào tạo",[10,9,11]],["Năng lực kỳ vọng",[12]],["Ưu tiên và yêu cầu bổ sung",[13,14,15]]];
function questionError(n, answers) {
  if (n === 9 && [3, 4].includes(answers['10.0']?.values?.[0])) return '';
  const fields = GROUPS[n].fields;
  for (const f of fields) {
    const a = answers[f.key] || {};
    if (f.options) {
      const v = a.values;
      if (!Array.isArray(v) || !v.length || v.length > (f.max || 1) ||
          new Set(v).size !== v.length || v.some(i => !Number.isInteger(i) || i < 0 || i >= f.options.length) ||
          (v.length > 1 && v.includes(f.exclusive))) return 'Vui lòng chọn phương án phù hợp.';
      if (v.some(i => f.detail?.[i] && (typeof a.details?.[i] !== 'string' ||
          !a.details[i].trim() || a.details[i].length > 250))) return 'Vui lòng điền thông tin cho phương án đã chọn.';
      continue;
    }
    const value = typeof a.text === 'string' ? a.text.trim() : '';
    if ((!f.optional && !value) || value.length > (f.kind === 'long' ? 3000 : 250)) return 'Vui lòng kiểm tra nội dung trả lời.';
    if (f.kind === 'number' || f.kind === 'countOrUnknown') {
      if (f.kind === 'countOrUnknown' && value.toUpperCase() === 'KXĐ') continue;
      if (!/^\d+$/.test(value) || !Number.isSafeInteger(Number(value))) return 'Vui lòng nhập số nguyên từ 0 trở lên' + (f.kind === 'countOrUnknown' ? ' hoặc KXĐ.' : '.');
    }
  }
  const counts = fields.map(f => Number(answers[f.key]?.text));
  if ([7,8].includes(n) && counts[1] > counts[0]) return 'Số có bằng thạc sĩ không thể lớn hơn tổng số nhân sự.';
  if (n === 9) {
    for (let i=0; i<counts.length; i+=3) {
      if (counts[i+1]+counts[i+2] > counts[i]) return 'Tổng số vị trí bắt buộc và ưu tiên bằng thạc sĩ không thể vượt số cần tuyển trong cùng giai đoạn.';
    }
  }
  return '';
}

const screen = document.querySelector('#screen');
const answers = {};
const receipt = globalThis.crypto?.randomUUID?.() || Date.now() + '-' + Math.random().toString(36).slice(2);
let page = -1;
let correcting = false;

function el(tag,text,parent) {
  const e = document.createElement(tag);
  e.textContent = text;
  parent.append(e);
  return e;
}
function renderField(parent,f) {
  const a = answers[f.key] ||= {values:[],details:{},text:''};
  const field = el('fieldset','',parent);
  if (f.label) el('legend',f.label,field);
  if (f.help) el('p',f.help,field).className = 'hint';
  if (!f.options) {
    const input = el(f.kind === 'long' ? 'textarea' : 'input','',field);
    if (input.tagName === 'INPUT') input.type='text';
    input.setAttribute('aria-label',f.label || f.column);
    input.maxLength = f.kind === 'long' ? 3000 : 250;
    if (f.kind === 'number') input.inputMode = 'numeric';
    input.value = a.text;
    input.oninput = () => { a.text = input.value; };
    return;
  }
  const choices = el('div','',field);
  if (f.scale) choices.className = 'scale';
  const controls = [];
  const extras = [];
  f.options.forEach((option,i) => {
    const label = el('label','',choices);
    label.className = 'choice';
    const input = el('input','',label);
    input.type = f.max ? 'checkbox' : 'radio';
    input.name = f.key;
    input.checked = a.values.includes(i);
    el('span',option,label);
    controls.push(input);
    let detail;
    if (f.detail?.[i]) {
      detail = el('label',f.detail[i],field);
      const extra = el('input','',detail);
      extra.type='text';
      extra.value = a.details[i] || '';
      extra.maxLength = 250;
      extra.oninput = () => { a.details[i] = extra.value; };
    }
    extras.push(detail);
    input.onchange = () => {
      let selected = controls.flatMap((c,j)=>c.checked?[j]:[]);
      if (input.checked && f.exclusive === i) selected = [i];
      else if (input.checked && f.exclusive !== undefined) selected = selected.filter(j=>j!==f.exclusive);
      if (selected.length > (f.max || 1)) {
        parent.lastElementChild.textContent='Vui lòng chọn tối đa '+f.max+' phương án.';
        selected = a.values;
      } else {
        parent.lastElementChild.textContent='';
      }
      a.values = selected;
      controls.forEach((c,j)=>{ c.checked=selected.includes(j); });
      extras.forEach((e,j)=>{ if(e) e.hidden=!selected.includes(j); });
      if (f.key === '10.0') {
        document.getElementById('q-9').hidden = [3,4].includes(a.values[0]);
      }
    };
  });
  extras.forEach((e,j)=>{if(e) e.hidden=!a.values.includes(j);});
}

function show(issue) {
  screen.replaceChildren();
  screen.parentElement.classList.toggle('welcome',page<0);
  if (page<0) {
    el('p','Thời gian trả lời khoảng 8–10 phút',screen).className='duration';
    el('h2','Thư mời tham gia khảo sát',screen);
    el('p','Kính gửi Quý Đơn vị,',screen).className='lead';
    el('p','Bộ môn Công tác xã hội, Khoa Khoa học Xã hội và Nhân văn, Trường Đại học Tôn Đức Thắng kính mời Quý Đơn vị chia sẻ về hiện trạng nhân sự, nhu cầu tuyển dụng và năng lực kỳ vọng. Kết quả khảo sát sẽ góp phần xây dựng đề án mở chương trình đào tạo trình độ thạc sĩ Công tác xã hội.',screen);
    el('p','Việc tham gia là tự nguyện. Kết quả khảo sát sẽ được trình bày dưới dạng tổng hợp.',screen).className='intro-note';
    const begin = el('button','Đang kiểm tra kết nối…',screen);
    begin.disabled = true;
    const connection = el('p','',screen);
    connection.setAttribute('role','status');
    async function checkConnection() {
      try {
        const response = await fetch('https://khao-sat-nhan-luc-ctxh.cottondogwood4.chatgpt.site/api/health', {signal:AbortSignal.timeout(20000)});
        if (!response.ok) throw new Error();
        begin.disabled=false;
        begin.textContent='Bắt đầu khảo sát';
        connection.textContent='';
        begin.onclick=()=>{page=0;show();};
      } catch(error) {
        connection.textContent='Phiếu đang được cập nhật kết nối. Vui lòng kiểm tra lại sau.';
        begin.disabled=false;
        begin.textContent='Kiểm tra lại kết nối';
        begin.onclick=()=>{begin.disabled=true;checkConnection();};
      }
    }
    checkConnection();
    return;
  }
  const progress=el('progress','',screen);
  progress.max=PAGES.length;
  progress.value=page+1;
  progress.setAttribute('aria-label','Tiến độ khảo sát');
  const heading=el('h2',PAGES[page][0],screen);
  heading.tabIndex=-1;
  const form=el('form','',screen);
  for(const n of PAGES[page][1]) {
    const g=GROUPS[n];
    const box=el('div','',form);
    box.className='group';
    box.id='q-'+n;
    if(n===9) box.hidden=[3,4].includes(answers['10.0']?.values?.[0]);
    el('h3',n+'. '+g.title,box);
    if(n===12) el('p','1 = Không cần · 2 = Ít cần · 3 = Cần ở mức vừa · 4 = Cần ở mức cao · 5 = Rất cần · KXĐ = Chưa có cơ sở đánh giá.',box).className='hint';
    if(n===4 || n===13) el('p','Chọn tối đa 3 phương án.',box).className='hint';
    if(n===14 || n===15) el('small','Không bắt buộc.',box);
    g.fields.forEach(f=>renderField(box,f));
    const error=el('p','',box);
    error.setAttribute('role','status');
    error.style.color='#8d243d';
  }
  const last=page===PAGES.length-1;
  if(last) el('p','Bộ môn Công tác xã hội chân thành cảm ơn Quý Đơn vị đã dành thời gian đóng góp ý kiến.',form);
  const status=el('p','',form);
  status.id='status';
  status.setAttribute('role','status');
  const nav=el('nav','',form);
  const back=el('button','Quay lại',nav);
  back.className='secondary';
  back.type='button';
  back.onclick=()=>{page--;show();};
  const next=el('button',last?'Gửi khảo sát':correcting?'Lưu chỉnh sửa':'Tiếp tục',nav);
  function displayError(n,message) {
    const box=document.getElementById('q-'+n);
    box.lastElementChild.textContent=message;
    box.querySelector('input,textarea')?.focus();
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    for(const n of PAGES[page][1]) {
      const error=questionError(n,answers);
      if(error){displayError(n,error);return;}
    }
    if(!last){
      page=correcting?PAGES.length-1:page+1;
      correcting=false;
      show();
      return;
    }
    for (const [n] of Object.entries(GROUPS)) {
      const error=questionError(Number(n),answers);
      if(error){
        page=PAGES.findIndex(p=>p[1].includes(Number(n)));
        correcting=true;
        show([n,error]);
        return;
      }
    }
    for(const input of form.elements) input.disabled=true;
    next.textContent='Đang gửi…';
    try {
      const response = await fetch('https://khao-sat-nhan-luc-ctxh.cottondogwood4.chatgpt.site/api/submit', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:receipt,answers}),
        signal:AbortSignal.timeout(45000)
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || 'Chưa lưu được phản hồi.');

      screen.replaceChildren();
      el('h2','Cảm ơn Quý Đơn vị đã tham gia khảo sát!',screen);
      el('p','Bộ môn Công tác xã hội đã nhận được phản hồi.',screen);
    } catch(error) {
      for(const input of form.elements) input.disabled=false;
      next.textContent='Gửi lại';
      status.textContent=error?.message||'Chưa gửi được phản hồi. Vui lòng thử lại.';
    }
  };
  heading.focus();
  window.scrollTo(0,0);
  if(issue) displayError(...issue);
}
show();

</script></body></html>
